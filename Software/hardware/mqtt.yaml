mqtt:
  broker: ${mqtt_address}
  port: ${mqtt_port}
  discovery: true
  birth_message:
    topic: ${main_topic}/state
    payload: online
  will_message:
    topic: ${main_topic}/state
    payload: offline
  on_message:
    - topic: ${main_topic}/${centrale_topic}/Automatica/command
      then:
        - if:
            condition:
              lambda: 'return x == "ON";'
            then:
              - switch.turn_on: centralina_switch
            else:
              - switch.turn_off: centralina_switch
    - topic: ${main_topic}/${centrale_topic}/Riavvia/command
      then:
        - if:
            condition:
              lambda: 'return x == "ON";'
            then:
              - button.press: esp_reboot_button

    - topic: ${main_topic}/${setpoint_topic}/Antigelo/command
      then:
        - number.set:
            id: setpoint_antigelo
            value: !lambda |-
              if (x.empty()) return 0;
              return (int)atoi(x.c_str()); 

    - topic: ${main_topic}/${setpoint_topic}/Max Temp/command
      then:
        - number.set:
            id: setpoint_temp_max
            value: !lambda |-
              if (x.empty()) return 0;
              return (int)atoi(x.c_str()); 

    - topic: ${main_topic}/${setpoint_topic}/Delta T/command
      then:
        - number.set:
            id: setpoint_delta_t
            value: !lambda |-
              if (x.empty()) return 0;
              return (int)atoi(x.c_str());

    - topic: ${main_topic}/${setpoint_topic}/Delta T Minimo/command
      then:
        - number.set:
            id: setpoint_delta_min
            value: !lambda |-
              if (x.empty()) return 0;
              return (int)atoi(x.c_str());

    - topic: ${main_topic}/${setpoint_topic}/Serbatoio 1 massimo/command
      then:
        - number.set:
            id: setpoint_max_S1
            value: !lambda |-
              if (x.empty()) return 0;
              return (int)atoi(x.c_str());

    - topic: ${main_topic}/${setpoint_topic}/Serbatoio 2 massimo/command
      then:
        - number.set:
            id: setpoint_max_S2
            value: !lambda |-
              if (x.empty()) return 0;
              return (int)atoi(x.c_str());

    - topic: ${main_topic}/${valvole_topic}/EV 1/command
      then:
        - if:
            condition:
              lambda: 'return x == "ON";'
            then:
              - switch.turn_on: valvola1
            else:
              - switch.turn_off: valvola1

    - topic: ${main_topic}/${valvole_topic}/EV 2/command
      then:
        - if:
            condition:
              lambda: 'return x == "ON";'
            then:
              - switch.turn_on: valvola2
            else:
              - switch.turn_off: valvola2

    - topic: ${main_topic}/${pompe_topic}/Consumo kWh/Pompa 1/command
      then:
        - text_sensor.template.publish:
            id: consumo_pompa_1
            state: !lambda |-
              if (x.empty()) {
                return std::string("0");
              }
              bool ok = true; // Verifica se tutti i caratteri sono numeri (e poss. un segno)
              for (char c : x) {
                if (!(isdigit(c) || c=='-' || c=='+')) { ok = false; break; }
              }
              if (!ok) {
                return std::string("errore");
              }
              return x;     // Altrimenti restituisci il payload originale

