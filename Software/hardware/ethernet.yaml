ethernet:
  type: W5500
  clk_pin: GPIO43
  mosi_pin: GPIO44
  miso_pin: GPIO42
  cs_pin: GPIO41
  interrupt_pin: GPIO2
  reset_pin: GPIO1
  manual_ip:
    static_ip: ${ip_address}
    gateway: ${ip_gateway}
    subnet: ${ip_subnet}
    dns1: 8.8.8.8       # DNS di Google
    dns2: 8.8.4.4       # DNS di Google