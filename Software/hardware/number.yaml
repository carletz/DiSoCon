number:
  - platform: template
    name: "Setpoint Antigelo"
    id: setpoint_antigelo
    icon: mdi:severe_cold
    min_value: -10
    max_value: 20
    step: 0.5
    initial_value: 5.0
    unit_of_measurement: "\u00b0C"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(temperatura_antigelo) = x;
        - mqtt.publish:
            topic: ${main_topic}/${setpoint_topic}/Antigelo/state
            payload: !lambda 'return to_string(x);'
            retain: True
    web_server:
      sorting_group_id: ordine_config
      sorting_weight: 10

  - platform: template
    name: "Setpoint Temp. Massima"
    id: setpoint_temp_max
    icon: mdi:emergency_heat_2
    min_value: 50
    max_value: 130
    step: 1
    initial_value: 100.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "\u00b0C"
    on_value:
      then:
        - lambda: |-
            id(temperatura_massima) = x;
        - mqtt.publish:
            topic: ${main_topic}/${setpoint_topic}/Max Temp/state
            payload: !lambda 'return to_string(x);'
            retain: True
    web_server:
      sorting_group_id: ordine_config
      sorting_weight: 9

  - platform: template
    name: "Setpoint Delta T"
    id: setpoint_delta_t
    icon: mdi:thermostat
    min_value: 0
    max_value: 15
    step: 0.5
    initial_value: 8.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "\u00b0C"
    on_value:
      then:
