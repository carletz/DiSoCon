text_sensor:
  - platform: version
    name: "Solare Versione"
    id: versione_esphome
    on_value:
      then:
        - mqtt.publish:
            topic: ${main_topic}/${diagnostica_topic}/Versione
            payload: !lambda 'return x;'
    web_server:
      sorting_group_id: ordine_varie
      sorting_weight: 1

  - platform: ethernet_info
    ip_address:
      name: "Solare IP"
      id: ip_address
      web_server:
        sorting_group_id: ordine_varie
    dns_address:
      name: "Solare DNS"
      id: dns_address
      web_server:
        sorting_group_id: ordine_varie
    mac_address:
      name: "Solare MAC"
      id: mac_address
      web_server:
        sorting_group_id: ordine_varie

  - platform: template
    name: "Uptime"
    icon: mdi:history
    update_interval: 10s
    state_topic: "${main_topic}/${diagnostica_topic}/Uptime"
    lambda: |-
      uint32_t s = (uint32_t) id(uptime_sensor_raw).state;
      uint32_t d = s / 86400;
      s %= 86400;
      uint32_t h = s / 3600;
      s %= 3600;
      uint32_t m = s / 60;
      s %= 60;
      char buf[32];
      if (d > 0)
        sprintf(buf, "%dd %02d:%02d:%02d", d, h, m, s);
      else
        sprintf(buf, "%02d:%02d:%02d", h, m, s);
      return {buf};
    web_server:
      sorting_group_id: ordine_varie
      sorting_weight: 1     

  - platform: template
    name: "Serbatoio In Uso"
    lambda: |-
      if (id(use_solare_1).state) {
        return std::string("Serbatoio 1 in uso");
      } else {
        return std::string("Serbatoio 2 in uso");
      }
    update_interval: 10s
    on_value:
      then:
        - mqtt.publish:
            topic: ${main_topic}/${serbatoio_topic}/In Uso/state
            payload: !lambda 'return x;'
            retain: true
    web_server:
      sorting_group_id: ordine_temp
      sorting_weight: -2

  - platform: template
    name: "Trend Temperatura Pannelli"
    id: temp_trend_pannelli_sensor
    lambda: |-
      int t = (int)id(temp_trend_pannelli).state;
      if (t == 1) {
        return {"🔺 Aumento"};
      } else if (t == -1) {
        return {"🔻 Calo"};
      } else {
        return {"➖ Stabile"};
      }
    on_value:
      then:
        - mqtt.publish:
            topic: ${main_topic}/${sonde_topic}/Trend Pannelli Solari/Testo/state
            payload: !lambda 'return x;'
            retain: True
    web_server:
      sorting_group_id: ordine_temp
      sorting_weight: -1

  - platform: template
    name: "Tempo totale pannelli > 80°C"
    lambda: |-
      int sec = id(tempo_totale) % 60;
      int min = id(tempo_totale) / 60;
      char buffer[10];
      sprintf(buffer, "%02d:%02d", min, sec);
      return {buffer};
    on_value:
